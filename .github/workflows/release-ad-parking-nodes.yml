name: Release AutoDrive Parking Node Rows
on:
  push:
    branches: [main]
    paths:
      - 'FS25_z_ADParkingNodes/**'
      - 'builds/FS25_z_ADParkingNodes.zip'
      - 'builds/ad-parking-nodes-build.json'
      - '.github/workflows/release-ad-parking-nodes.yml'
  pull_request:
    paths:
      - 'FS25_z_ADParkingNodes/**'
      - 'builds/FS25_z_ADParkingNodes.zip'
      - '.github/workflows/release-ad-parking-nodes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua test runtime
        run: python -m pip install lupa==2.8
      - name: Verify source, behavior and exact release package
        run: python FS25_z_ADParkingNodes/build.py --check
      - name: Publish verified package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import json; assert json.load(open('builds/ad-parking-nodes-build.json'))['runtime_verified'], 'In-game verification is required before publishing'"
          version=$(python -c "import json; print(json.load(open('builds/ad-parking-nodes-build.json'))['version'])")
          tag="ad-parking-nodes-v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "AutoDrive Parking Node Rows $version" --notes-file FS25_z_ADParkingNodes/RELEASE-NOTES.md builds/FS25_z_ADParkingNodes.zip builds/SHA256SUMS-ad-parking-nodes.txt
          fi
